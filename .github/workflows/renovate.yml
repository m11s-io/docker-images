# Managed by infra/github; edit the shared workflow or its OpenTofu settings.
name: Maintenance

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Inspect updates without writing to GitHub
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    uses: m11s-io/.github/.github/workflows/maintenance.yml@9a8af8571ce84d504e63ef665dca3c0359b9d96e
    with:
      host-ref: 9a8af8571ce84d504e63ef665dca3c0359b9d96e
      live: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry-run }}
    secrets:
      RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
