# Managed by infra/github; edit the shared workflow or its OpenTofu settings.
name: Maintenance

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Inspect updates without writing to GitHub
        type: boolean
        default: true

permissions:
  actions: read
  contents: read
  security-events: write

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  maintenance:
    uses: m11s-io/.github/.github/workflows/maintenance.yml@3c526268857210cc39f2d502c2000d4a0ea975b1
    with:
      host-ref: 3c526268857210cc39f2d502c2000d4a0ea975b1
      live: ${{ github.event_name != 'workflow_dispatch' || !inputs.dry-run }}
    secrets:
      RENOVATE_APP_PRIVATE_KEY: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
