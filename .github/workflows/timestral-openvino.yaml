name: Timestral OpenVINO experimental

on:
  workflow_dispatch:
    inputs:
      bundle_contract:
        description: 'Profile contract to validate and publish'
        type: choice
        default: legacy-ovms
        options: [legacy-ovms, standard-v1]
  pull_request:
    paths:
      - "timestral-openvino/**"
      - ".github/workflows/timestral-openvino.yaml"

permissions:
  contents: read

concurrency:
  group: timestral-openvino-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: ${{ inputs.bundle_contract != 'standard-v1' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: timestral-openvino
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - name: Install isolated frozen export dependencies
        run: uv sync --frozen
      - name: Unit tests
        run: uv run --frozen python -m unittest discover -s tests
      - name: Export and compare against unmodified upstream
        run: uv run --frozen python export.py --output "$RUNNER_TEMP/bundle"
      - name: Validate real OVMS REST inference
        run: |
          docker run -d --name timestral-ovms --platform linux/amd64 \
            -p 127.0.0.1:18000:8000 \
            -v "$RUNNER_TEMP/bundle/model:/models/model:ro" \
            openvino/model_server:2026.4.1@sha256:148e3fe802261ed0b5b634de3bbccdefe7176a218ec34a88e382b40704c34a1c \
            --model_name model --model_path /models/model --rest_port 8000 \
            --plugin_config '{"INFERENCE_PRECISION_HINT":"f32"}'
          uv run --frozen python validate_ovms.py --bundle "$RUNNER_TEMP/bundle"
      - name: Seal publication bundle
        run: |
          cp model-card.md "$RUNNER_TEMP/bundle/README.md"
          uv run --frozen python package.py --bundle "$RUNNER_TEMP/bundle"
      - name: OVMS diagnostics and cleanup
        if: always()
        run: |
          if docker container inspect timestral-ovms >/dev/null 2>&1; then
            docker logs timestral-ovms
            docker rm -f timestral-ovms
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: timestral-openvino-validated
          path: ${{ runner.temp }}/bundle/
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: [validate]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      HF_OIDC_RESOURCE: ${{ vars.HF_TIMESTRAL_OPENVINO_REPO }}
    defaults:
      run:
        working-directory: timestral-openvino
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: timestral-openvino-validated
          path: ${{ runner.temp }}/bundle/
      - name: Install frozen dependencies and verify bundle
        run: |
          test -n "$HF_OIDC_RESOURCE"
          uv sync --frozen
          uv run --frozen python package.py --verify "$RUNNER_TEMP/bundle"
      - name: Publish through OIDC and verify immutable HF commit
        run: uv run --frozen python publish.py --bundle "$RUNNER_TEMP/bundle"

  standard-validate:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_contract == 'standard-v1' && github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/timestral-standard.yaml

  standard-publish:
    needs: standard-validate
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_contract == 'standard-v1' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 1
      matrix:
        model: [5M, 209M]
    env:
      HF_OIDC_RESOURCE: ${{ vars.HF_TIMESTRAL_OPENVINO_REPO }}
      PYTHONPATH: timestral
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.6'
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: timestral-openvino-preview-${{ matrix.model }}-${{ github.sha }}
          path: ${{ runner.temp }}/standard-bundle
      - name: Seal same-run publication identity
        env:
          BUNDLE: ${{ runner.temp }}/standard-bundle
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root=Path(os.environ['BUNDLE'])
          (root/'evidence/provenance.json').write_text(json.dumps(dict(
              source=os.environ['GITHUB_SHA'],run=os.environ['GITHUB_RUN_ID'])))
          PYTHON
      - name: Verify, publish versioned profiles and recheck immutable HF commit
        env:
          BUNDLE: ${{ runner.temp }}/standard-bundle
        run: |
          uv run --frozen --project timestral/openvino/export python \
            timestral-openvino/publish_standard.py --bundle "$BUNDLE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: timestral-standard-publication-${{ matrix.model }}
          path: standard-publication.json
          if-no-files-found: error
