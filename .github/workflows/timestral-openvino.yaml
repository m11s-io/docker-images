name: Timestral OpenVINO publication

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      reuse-validation:
        description: Reuse successful validation artifacts from the calling release run
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: timestral-openvino-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.ref == 'refs/heads/main' && !inputs.reuse-validation
    uses: ./.github/workflows/timestral-standard.yaml

  publish:
    needs: [validate]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          ((inputs.reuse-validation && needs.validate.result == 'skipped') ||
           (!inputs.reuse-validation && needs.validate.result == 'success')) }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        model: [5M, 28M, 123M, 209M]
    env:
      HF_OIDC_RESOURCE: ${{ vars.HF_TIMESTRAL_OPENVINO_REPO }}
      PYTHONPATH: timestral
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.6'
          python-version: '3.13'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Resolve published image for this source commit
        run: |
          image_tag="m11s/timestral:sha-${GITHUB_SHA:0:12}-openvino"
          digest=$(docker buildx imagetools inspect "$image_tag" --format '{{.Manifest.Digest}}')
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "TIMESTRAL_RELEASE_IMAGE=m11s/timestral@$digest" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: timestral-openvino-preview-${{ matrix.model }}-${{ github.sha }}
          path: ${{ runner.temp }}/standard-bundle
      - name: Seal same-run publication identity
        env:
          BUNDLE: ${{ runner.temp }}/standard-bundle
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root=Path(os.environ['BUNDLE'])
          (root/'evidence/provenance.json').write_text(json.dumps(dict(
              source=os.environ['GITHUB_SHA'],run=os.environ['GITHUB_RUN_ID'])))
          PYTHON
      - name: Verify, publish versioned profiles and recheck immutable HF commit
        env:
          BUNDLE: ${{ runner.temp }}/standard-bundle
        run: |
          uv run --frozen --project timestral/openvino/export python \
            timestral/openvino/export/publish.py --bundle "$BUNDLE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: timestral-standard-publication-${{ matrix.model }}
          path: standard-publication.json
          if-no-files-found: error

  release:
    needs: [publish]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: timestral-standard-publication-*
          path: receipts
      - name: Collect immutable deployment references
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          records=[json.loads(p.read_text()) for p in Path('receipts').rglob('standard-publication.json')]
          models={r['model_id']:r for r in records}
          expected={f'mistralai/Timestral-{size}' for size in ('5M','28M','123M','209M')}
          if len(records)!=4 or set(models)!=expected:
              raise ValueError('release requires exactly one receipt for each model')
          if any(r['source']!=os.environ['GITHUB_SHA'] or r['run']!=os.environ['GITHUB_RUN_ID'] for r in records):
              raise ValueError('release receipts must come from this source and run')
          images={r['image'] for r in records}
          if len(images)!=1:
              raise ValueError('all models must use the same immutable runtime image')
          release=dict(source=os.environ['GITHUB_SHA'],image=images.pop(),models=models)
          Path('timestral-openvino-release.json').write_text(json.dumps(release,indent=2)+'\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'],'a') as f:
              f.write('```json\n'+json.dumps(release,indent=2)+'\n```\n')
          PYTHON
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: timestral-openvino-release-${{ github.sha }}
          path: timestral-openvino-release.json
          if-no-files-found: error
