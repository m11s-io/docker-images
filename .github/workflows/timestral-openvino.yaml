name: Timestral OpenVINO publication

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: timestral-openvino-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/timestral-standard.yaml

  publish:
    needs: [validate]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    strategy:
      max-parallel: 1
      matrix:
        model: [5M, 209M]
    env:
      HF_OIDC_RESOURCE: ${{ vars.HF_TIMESTRAL_OPENVINO_REPO }}
      PYTHONPATH: timestral
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: '0.13.6'
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: timestral-openvino-preview-${{ matrix.model }}-${{ github.sha }}
          path: ${{ runner.temp }}/standard-bundle
      - name: Seal same-run publication identity
        env:
          BUNDLE: ${{ runner.temp }}/standard-bundle
        run: |
          python3 - <<'PYTHON'
          import json, os
          from pathlib import Path
          root=Path(os.environ['BUNDLE'])
          (root/'evidence/provenance.json').write_text(json.dumps(dict(
              source=os.environ['GITHUB_SHA'],run=os.environ['GITHUB_RUN_ID'])))
          PYTHON
      - name: Verify, publish versioned profiles and recheck immutable HF commit
        env:
          BUNDLE: ${{ runner.temp }}/standard-bundle
        run: |
          uv run --frozen --project timestral/openvino/export python \
            timestral/openvino/export/publish.py --bundle "$BUNDLE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: timestral-standard-publication-${{ matrix.model }}
          path: standard-publication.json
          if-no-files-found: error
