name: Timestral standard-serving acceptance

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: 0.13.6
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "timestral/**/uv.lock"
      - name: Check Timestral dependencies, guards and regressions
        run: bash timestral/ci/check-unit.sh

  cpu-image:
    needs: unit
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        model: [5M, 28M, 123M, 209M]
        include:
          - model: 5M
            revision: bdd20cfc15a3fea0e4cb5ccef37f8d3ca7aa335f
          - model: 28M
            revision: 49b26409ac87b5935539a5d8ffe7f397b720db47
          - model: 123M
            revision: 5a147287addda85f6acd8da3fb8858fe9af7e8f7
          - model: 209M
            revision: 9874d252ab0aae16f7f7c999f98f98d6ad7d8365
    env:
      MODEL_ID: mistralai/Timestral-${{ matrix.model }}
      MODEL_REVISION: ${{ matrix.revision }}
      TIMESTRAL_TEST_HTTP_URL: localhost:18080
      TIMESTRAL_TEST_GRPC_URL: localhost:18081
      PYTHONPATH: timestral
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: 0.13.6
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: timestral/dependencies/cpu/uv.lock
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build native amd64 candidate without publication
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: timestral
          file: timestral/Dockerfile.cpu
          platforms: linux/amd64
          push: false
          load: true
          tags: timestral-standard:candidate
          cache-from: type=gha,scope=timestral-standard-cpu
          cache-to: type=gha,scope=timestral-standard-cpu,mode=max
      - name: Check default forecasts against independent upstream
        run: bash timestral/ci/test-cpu.sh
      - name: Save logs and remove test container
        if: always()
        run: bash timestral/ci/cleanup-cpu.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: timestral-cpu-${{ matrix.model }}-${{ github.sha }}
          path: ${{ runner.temp }}/evidence/
          if-no-files-found: error

  openvino-preview:
    needs: unit
    strategy:
      fail-fast: false
      matrix:
        include:
          - model: 5M
            revision: bdd20cfc15a3fea0e4cb5ccef37f8d3ca7aa335f
          - model: 28M
            revision: 49b26409ac87b5935539a5d8ffe7f397b720db47
          - model: 123M
            revision: 5a147287addda85f6acd8da3fb8858fe9af7e8f7
          - model: 209M
            revision: 9874d252ab0aae16f7f7c999f98f98d6ad7d8365
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      PYTHONPATH: timestral
      MODEL_ID: mistralai/Timestral-${{ matrix.model }}
      MODEL_REVISION: ${{ matrix.revision }}
      TIMESTRAL_TEST_HTTP_URL: localhost:18080
      TIMESTRAL_TEST_GRPC_URL: localhost:18081
      TIMESTRAL_TEST_BACKEND: openvino
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          version: 0.13.6
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "timestral/openvino/**/uv.lock"
      - name: Check direct runtime and export guards
        run: |
          uv run --frozen --project timestral/openvino python -m pytest \
            timestral/tests/test_openvino_profiles.py timestral/openvino/tests -q \
            -o asyncio_default_fixture_loop_scope=function
      - name: Export versioned profiles and compare complete forecasts
        run: |
          uv run --frozen --project timestral/openvino/export python \
            timestral/openvino/export/profiles.py --model-size "${{ matrix.model }}" --output "$RUNNER_TEMP/openvino-candidate"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build direct-runtime image without publication
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: timestral
          file: timestral/Dockerfile.openvino
          platforms: linux/amd64
          push: false
          load: true
          tags: timestral-standard:openvino-preview
          cache-from: type=gha,scope=timestral-standard-openvino
          cache-to: type=gha,scope=timestral-standard-openvino,mode=max
      - name: Start preview with read-only verified profiles
        run: bash timestral/ci/start-openvino.sh
      - name: Verify CPU-equivalent REST/gRPC inference and invalid request errors
        run: |
          uv run --frozen --project timestral/openvino python -m pytest \
            timestral/tests/integration/test_triton_client.py -q \
            -o asyncio_default_fixture_loop_scope=function \
            --junitxml="$RUNNER_TEMP/openvino-candidate/evidence/protocol-parity.xml"
      - name: Save image evidence and remove preview container
        if: always()
        run: bash timestral/ci/cleanup-openvino.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: timestral-openvino-preview-${{ matrix.model }}-${{ github.sha }}
          path: ${{ runner.temp }}/openvino-candidate/
          if-no-files-found: error
