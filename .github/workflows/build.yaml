name: Build and push

on:
  push:
    branches: [main]
    paths:
      - "rclone-inotify/**"
      - "decap-cms/**"
      - "s3-upload-proxy/**"
      - "redis-http-proxy/**"
      - "comfyui/**"
      - "comfy-mcp/**"
      - "deepseek-harness/**"
      - "chromium-cdp/**"
      - ".github/workflows/build.yaml"
      - "caddy-cloudflare/**"
      - "vllm-openai-orjson/**"
      - "timestral/**"
      - "scripts/image_tags.py"
      - "scripts/native_image_matrix.py"
      - "scripts/test_native_image_matrix.py"
      - "scripts/test_timestral_runtime.py"
      - "scripts/test_comfyui_validation.py"
      # Deployment examples and docs do not change the published images.
      - "!**/compose*.yaml"
      - "!**/compose*.yml"
      - "!**/docker-compose*.yaml"
      - "!**/docker-compose*.yml"
      - "!**/*.md"
      - "!**/docs/**"
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to build'
        required: false
        type: choice
        default: all
        options:
          - all
          - decap-cms
          - rclone-inotify
          - s3-upload-proxy
          - redis-http-proxy
          - comfyui
          - comfy-mcp
          - deepseek-harness
          - chromium-cdp
          - caddy-cloudflare
          - vllm-openai-orjson
          - timestral-cpu
          - timestral-cuda
      skip_push:
        description: 'Dry-run: build without pushing to Docker Hub'
        required: false
        type: boolean
        default: false

jobs:
  timestral-tests:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up uv and Python 3.15
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e  # v10.3.2
        with:
          version: 0.13.6
          python-version: "3.15"
          enable-cache: true
          cache-dependency-glob: timestral/uv.lock
      - name: Check Timestral runtime alignment
        run: python3 -m unittest discover -s scripts -p 'test_timestral_runtime.py'
      - name: Run Timestral API unit tests
        working-directory: timestral
        run: uv run --frozen pytest tests/test_api.py -q

  changes:
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      rclone-inotify: ${{ steps.filter.outputs.rclone-inotify }}
      decap-cms: ${{ steps.filter.outputs.decap-cms }}
      s3-upload-proxy: ${{ steps.filter.outputs.s3-upload-proxy }}
      redis-http-proxy: ${{ steps.filter.outputs.redis-http-proxy }}
      comfyui: ${{ steps.filter.outputs.comfyui }}
      comfyui-generic: ${{ steps.filter.outputs.comfyui-generic }}
      comfyui-gguf: ${{ steps.filter.outputs.comfyui-gguf }}
      comfy-mcp: ${{ steps.filter.outputs.comfy-mcp }}
      deepseek-harness: ${{ steps.filter.outputs.deepseek-harness }}
      chromium-cdp: ${{ steps.filter.outputs.chromium-cdp }}
      caddy-cloudflare: ${{ steps.filter.outputs.caddy-cloudflare }}
      vllm-openai-orjson: ${{ steps.filter.outputs.vllm-openai-orjson }}
      timestral-cpu: ${{ steps.filter.outputs.timestral-cpu }}
      timestral-cuda: ${{ steps.filter.outputs.timestral-cuda }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check image tag resolver
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          # Keep OR matching for shared scripts while honoring exclusions.
          predicate-quantifier: some-with-excludes
          filters: |
            rclone-inotify:
              - 'scripts/image_tags.py'
              - 'rclone-inotify/**'
              - '!**/compose*.yaml'
              - '!**/compose*.yml'
              - '!**/docker-compose*.yaml'
              - '!**/docker-compose*.yml'
              - '!**/*.md'
              - '!**/docs/**'
            decap-cms:
              - 'scripts/image_tags.py'
              - 'decap-cms/**'
              - '!**/compose*.yaml'
              - '!**/compose*.yml'
              - '!**/docker-compose*.yaml'
              - '!**/docker-compose*.yml'
              - '!**/*.md'
              - '!**/docs/**'
            s3-upload-proxy:
              - 'scripts/image_tags.py'
              - 's3-upload-proxy/**'
              - '!**/compose*.yaml'
              - '!**/compose*.yml'
              - '!**/docker-compose*.yaml'
              - '!**/docker-compose*.yml'
              - '!**/*.md'
              - '!**/docs/**'
            redis-http-proxy:
              - 'scripts/image_tags.py'
              - 'redis-http-proxy/**'
              - '!**/compose*.yaml'
              - '!**/compose*.yml'
              - '!**/docker-compose*.yaml'
              - '!**/docker-compose*.yml'
              - '!**/*.md'
              - '!**/docs/**'
            comfyui:
              - 'scripts/image_tags.py'
              - 'comfyui/**'
              - '!**/compose*.yaml'
              - '!**/compose*.yml'
              - '!**/docker-compose*.yaml'
              - '!**/docker-compose*.yml'
              - '!**/*.md'
              - '!**/docs/**'
            comfyui-generic:
              - 'scripts/image_tags.py'
              - 'comfyui/**'
              - '!comfyui/Dockerfile.gguf'
              - '!**/compose*.yaml'
              - '!**/compose*.yml'
              - '!**/docker-compose*.yaml'
              - '!**/docker-compose*.yml'
              - '!**/*.md'
              - '!**/docs/**'
            comfyui-gguf:
              - 'scripts/image_tags.py'
              - 'comfyui/Dockerfile.gguf'
            comfy-mcp:
              - 'scripts/native_image_matrix.py'
              - 'scripts/image_tags.py'
              - 'comfy-mcp/**'
              - '!**/compose*.yaml'
              - '!**/compose*.yml'
              - '!**/docker-compose*.yaml'
              - '!**/docker-compose*.yml'
              - '!**/*.md'
              - '!**/docs/**'
            deepseek-harness:
              - 'scripts/native_image_matrix.py'
              - 'scripts/image_tags.py'
              - 'deepseek-harness/**'
              - '!**/compose*.yaml'
              - '!**/compose*.yml'
              - '!**/docker-compose*.yaml'
              - '!**/docker-compose*.yml'
              - '!**/*.md'
              - '!**/docs/**'
            chromium-cdp:
              - 'scripts/native_image_matrix.py'
              - 'scripts/image_tags.py'
              - 'chromium-cdp/**'
              - '!**/compose*.yaml'
              - '!**/compose*.yml'
              - '!**/docker-compose*.yaml'
              - '!**/docker-compose*.yml'
              - '!**/*.md'
              - '!**/docs/**'
            caddy-cloudflare:
              - 'scripts/image_tags.py'
              - 'caddy-cloudflare/**'
              - '!**/compose*.yaml'
              - '!**/compose*.yml'
              - '!**/docker-compose*.yaml'
              - '!**/docker-compose*.yml'
              - '!**/*.md'
              - '!**/docs/**'
            vllm-openai-orjson:
              - 'scripts/image_tags.py'
              - 'vllm-openai-orjson/**'
              - '!**/compose*.yaml'
              - '!**/compose*.yml'
              - '!**/docker-compose*.yaml'
              - '!**/docker-compose*.yml'
              - '!**/*.md'
              - '!**/docs/**'
            timestral-cpu:
              - 'scripts/image_tags.py'
              - 'timestral/**'
              - '!**/compose*.yaml'
              - '!**/compose*.yml'
              - '!**/docker-compose*.yaml'
              - '!**/docker-compose*.yml'
              - '!**/*.md'
              - '!**/docs/**'
            timestral-cuda:
              - 'scripts/image_tags.py'
              - 'timestral/**'
              - '!**/compose*.yaml'
              - '!**/compose*.yml'
              - '!**/docker-compose*.yaml'
              - '!**/docker-compose*.yml'
              - '!**/*.md'
              - '!**/docs/**'

  build:
    needs: [changes]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - context: rclone-inotify
            repository: m11s/rclone
            description: rclone with inotify-tools for filesystem event monitoring.
            version_source: base-image
            version_ref: rclone/rclone
            tag_suffix: -inotify
            latest: latest-inotify
          - context: decap-cms
            repository: m11s/decap-cms
            description: Decap CMS with an S3-compatible media library.
            version: 0.2.11-s3
            latest: latest-s3
          - context: s3-upload-proxy
            repository: m11s/s3-upload-proxy
            description: Multipart upload proxy for S3-compatible object storage.
            version_source: version-arg
            version_ref: S3_UPLOAD_PROXY_VERSION
            latest: latest
          - context: redis-http-proxy
            repository: m11s/redis-http-proxy
            description: Bearer-token-authenticated HTTP proxy for Redis.
            version: 0.1.0
            latest: latest
          - context: comfyui
            repository: m11s/comfyui
            description: CUDA-enabled ComfyUI image, with an optional GGUF variant.
            version_source: version-arg
            version_ref: COMFYUI_REF
            strip_prefix: v
            latest: latest
          - context: caddy-cloudflare
            repository: m11s/caddy
            description: Caddy with the Cloudflare DNS-01 provider module.
            version_source: base-arg
            version_ref: CADDY_BASE_IMAGE
            strip_suffix: -alpine
            tag_suffix: -cloudflare
            latest: latest-cloudflare
          - context: vllm-openai-orjson
            repository: m11s/vllm-openai-orjson
            description: vLLM OpenAI server image with faster orjson serialization.
            version_source: base-arg
            version_ref: VLLM_BASE_IMAGE
            latest: latest-x86_64
          - context: timestral-cpu
            build_context: timestral
            dockerfile: timestral/Dockerfile.cpu
            readme_file: timestral/README.md
            repository: m11s/timestral
            description: Timestral forecasting API with CPU-only PyTorch.
            version_source: version-arg
            version_ref: TIMESTRAL_VERSION
            tag_suffix: -cpu
            latest: latest-cpu
          - context: timestral-cuda
            build_context: timestral
            dockerfile: timestral/Dockerfile.cuda
            readme_file: timestral/README.md
            repository: m11s/timestral
            description: Timestral forecasting API with NVIDIA CUDA-enabled PyTorch.
            version_source: version-arg
            version_ref: TIMESTRAL_VERSION
            tag_suffix: -cuda
            latest: latest-cuda
    steps:
      - name: Checkout
        id: checkout
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.image == 'all' || inputs.image == matrix.context)) || (github.event_name == 'pull_request' && ((matrix.context == 'comfyui' && (needs.changes.outputs.comfyui-generic == 'true' || needs.changes.outputs.comfyui-gguf == 'true')) || (matrix.context != 'comfyui' && needs.changes.outputs[matrix.context] == 'true'))) || (github.event_name != 'workflow_dispatch' && github.event_name != 'pull_request' && needs.changes.outputs[matrix.context] == 'true') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Resolve image tags
        id: image-tags
        if: ${{ steps.checkout.outcome == 'success' }}
        env:
          IMAGE_CONTEXT: ${{ matrix.context }}
          IMAGE_DOCKERFILE: ${{ matrix.dockerfile }}
          IMAGE_REPOSITORY: ${{ matrix.repository }}
          IMAGE_VERSION: ${{ matrix.version }}
          VERSION_SOURCE: ${{ matrix.version_source }}
          VERSION_REF: ${{ matrix.version_ref }}
          STRIP_PREFIX: ${{ matrix.strip_prefix }}
          STRIP_SUFFIX: ${{ matrix.strip_suffix }}
          TAG_SUFFIX: ${{ matrix.tag_suffix }}
          LATEST_TAG: ${{ matrix.latest }}
        run: |
          args=(--repository "$IMAGE_REPOSITORY" --sha "$GITHUB_SHA"
                --strip-prefix "$STRIP_PREFIX" --strip-suffix="$STRIP_SUFFIX")
          if [[ -n "$VERSION_SOURCE" ]]; then
            dockerfile=${IMAGE_DOCKERFILE:-$IMAGE_CONTEXT/Dockerfile}
            args+=("--$VERSION_SOURCE" "$VERSION_REF" --dockerfile "$dockerfile")
          else
            args+=(--version "$IMAGE_VERSION")
          fi
          tags=$(python3 scripts/image_tags.py "${args[@]}" --latest "$LATEST_TAG" --suffix="$TAG_SUFFIX")
          {
            echo "image=${tags%%$'\n'*}"
            echo 'tags<<IMAGE_TAGS'
            echo "$tags"
            echo 'IMAGE_TAGS'
          } >> "$GITHUB_OUTPUT"
          if [[ "$IMAGE_CONTEXT" == comfyui ]]; then
            gguf_tags=$(python3 scripts/image_tags.py "${args[@]}" --suffix=-gguf --latest latest-gguf)
            {
              echo "gguf-image=${gguf_tags%%$'\n'*}"
              echo 'gguf-tags<<IMAGE_TAGS'
              echo "$gguf_tags"
              echo 'IMAGE_TAGS'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: ${{ github.event_name != 'pull_request' && ((github.event_name == 'workflow_dispatch' && (inputs.image == 'all' || inputs.image == matrix.context)) || (github.event_name != 'workflow_dispatch' && needs.changes.outputs[matrix.context] == 'true')) }}
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Set up Docker Buildx
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.image == 'all' || inputs.image == matrix.context)) || (github.event_name == 'pull_request' && ((matrix.context == 'comfyui' && (needs.changes.outputs.comfyui-generic == 'true' || needs.changes.outputs.comfyui-gguf == 'true')) || (matrix.context != 'comfyui' && needs.changes.outputs[matrix.context] == 'true'))) || (github.event_name != 'workflow_dispatch' && github.event_name != 'pull_request' && needs.changes.outputs[matrix.context] == 'true') }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build and push
        id: generic
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.image == 'all' || inputs.image == matrix.context)) || (github.event_name == 'pull_request' && ((matrix.context == 'comfyui' && needs.changes.outputs.comfyui-generic == 'true') || (matrix.context != 'comfyui' && needs.changes.outputs[matrix.context] == 'true'))) || (github.event_name == 'push' && ((matrix.context == 'comfyui' && needs.changes.outputs.comfyui-generic == 'true') || (matrix.context != 'comfyui' && needs.changes.outputs[matrix.context] == 'true'))) }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.build_context || matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' && github.event.inputs.skip_push != 'true' }}
          load: ${{ matrix.context == 'comfyui' && (github.event_name == 'pull_request' || github.event.inputs.skip_push == 'true') }}
          tags: ${{ steps.image-tags.outputs.tags }}
          cache-from: type=gha,scope=${{ matrix.context }}
          cache-to: type=gha,scope=${{ matrix.context }},mode=max

      - name: Resolve ComfyUI-GGUF parent build args
        id: gguf-build-args
        if: ${{ github.event_name != 'pull_request' && github.event.inputs.skip_push != 'true' && matrix.context == 'comfyui' && ((github.event_name == 'workflow_dispatch' && (inputs.image == 'all' || inputs.image == matrix.context)) || (github.event_name == 'push' && (needs.changes.outputs.comfyui-generic == 'true' || needs.changes.outputs.comfyui-gguf == 'true'))) }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          GENERIC_CHANGED: ${{ needs.changes.outputs.comfyui-generic }}
          GENERIC_DIGEST: ${{ steps.generic.outputs.digest }}
        run: |
          if [[ "$EVENT_NAME" == workflow_dispatch || "$GENERIC_CHANGED" == true ]]; then
            {
              echo 'args<<BUILD_ARGS'
              echo "COMFYUI_BASE=m11s/comfyui@$GENERIC_DIGEST"
              echo 'BUILD_ARGS'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push ComfyUI-GGUF variant
        if: ${{ github.event_name != 'pull_request' && github.event.inputs.skip_push != 'true' && matrix.context == 'comfyui' && ((github.event_name == 'workflow_dispatch' && (inputs.image == 'all' || inputs.image == matrix.context)) || (github.event_name == 'push' && (needs.changes.outputs.comfyui-generic == 'true' || needs.changes.outputs.comfyui-gguf == 'true'))) }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: comfyui
          file: comfyui/Dockerfile.gguf
          platforms: linux/amd64
          build-args: ${{ steps.gguf-build-args.outputs.args }}
          push: ${{ github.event.inputs.skip_push != 'true' }}
          tags: ${{ steps.image-tags.outputs.gguf-tags }}
          cache-from: type=gha,scope=comfyui-gguf
          cache-to: type=gha,scope=comfyui-gguf,mode=max

      - name: Build ComfyUI-GGUF variant without pushing
        if: ${{ github.event.inputs.skip_push == 'true' && matrix.context == 'comfyui' && github.event_name == 'workflow_dispatch' && (inputs.image == 'all' || inputs.image == matrix.context) }}
        env:
          COMFYUI_BASE: ${{ steps.image-tags.outputs.image }}
          GGUF_IMAGE: ${{ steps.image-tags.outputs.gguf-image }}
        run: |
          docker buildx build --builder default --platform linux/amd64 --load \
            --build-arg "COMFYUI_BASE=$COMFYUI_BASE" \
            -f comfyui/Dockerfile.gguf -t "$GGUF_IMAGE" comfyui

      - name: Build ComfyUI-GGUF variant for pull request
        if: ${{ github.event_name == 'pull_request' && matrix.context == 'comfyui' && (needs.changes.outputs.comfyui-gguf == 'true' || needs.changes.outputs.comfyui-generic == 'true') }}
        env:
          COMFYUI_IMAGE: ${{ steps.image-tags.outputs.image }}
          GGUF_IMAGE: ${{ steps.image-tags.outputs.gguf-image }}
          GENERIC_CHANGED: ${{ needs.changes.outputs.comfyui-generic }}
        run: |
          args=(--builder default --platform linux/amd64 --load)
          if [[ "$GENERIC_CHANGED" == true ]]; then
            args+=(--build-arg "COMFYUI_BASE=$COMFYUI_IMAGE")
          fi
          docker buildx build "${args[@]}" -f comfyui/Dockerfile.gguf -t "$GGUF_IMAGE" comfyui

      - name: Update Docker Hub repository overview
        if: ${{ github.event_name != 'pull_request' && github.event.inputs.skip_push != 'true' && ((github.event_name == 'workflow_dispatch' && (inputs.image == 'all' || inputs.image == matrix.context)) || (github.event_name != 'workflow_dispatch' && needs.changes.outputs[matrix.context] == 'true')) }}
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
          repository: ${{ matrix.repository }}
          short-description: ${{ matrix.description }}
          readme-filepath: ./${{ matrix.readme_file || format('{0}/README.md', matrix.context) }}
          enable-url-completion: true

  native-prepare:
    needs: [changes]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      has-images: ${{ steps.matrix.outputs.has-images }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Check image selection and tags
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Select native multi-platform builds
        id: matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_IMAGE: ${{ inputs.image || 'all' }}
          CHANGED_IMAGES: |
            {"deepseek-harness":"${{ needs.changes.outputs.deepseek-harness }}",
             "chromium-cdp":"${{ needs.changes.outputs.chromium-cdp }}",
             "comfy-mcp":"${{ needs.changes.outputs.comfy-mcp }}"}
          NATIVE_IMAGES: |
            [{"context":"deepseek-harness","repository":"m11s/deepseek-harness",
              "version_source":"version-arg","version_ref":"DSH_REF",
              "strip_prefix":"dsh-v","latest":"latest",
              "description":"DeepSeek Harness web runtime with an optional remote browser provider."},
             {"context":"chromium-cdp","repository":"m11s/chromium-cdp",
              "version":"bookworm-20261005","latest":"latest",
              "description":"Headless Chromium browser with a Chrome DevTools Protocol listener."},
             {"context":"comfy-mcp","repository":"m11s/comfy-mcp",
              "version_source":"version-arg","version_ref":"COMFY_MCP_REF",
              "strip_prefix":"v","latest":"latest",
              "description":"Comfy MCP server with stdio and native Streamable HTTP transports."}]
        run: |
          python3 scripts/native_image_matrix.py --images "$NATIVE_IMAGES" \
            --event "$EVENT_NAME" --selected "$SELECTED_IMAGE" \
            --changed "$CHANGED_IMAGES" --sha "$GITHUB_SHA" >> "$GITHUB_OUTPUT"

  native-build:
    needs: [native-prepare]
    if: ${{ !failure() && !cancelled() && needs.native-prepare.outputs.has-images == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.native-prepare.outputs.matrix) }}
    uses: docker/github-builder/.github/workflows/build.yml@cbc9d42f8c89a55623392aadd03600965b80e963  # v1
    permissions:
      contents: read
      id-token: write
    with:
      job-name-prefix: ${{ matrix.context }}
      context: ${{ matrix.context }}
      output: image
      push: ${{ github.event_name != 'pull_request' && github.event.inputs.skip_push != 'true' }}
      platforms: linux/amd64,linux/arm64
      distribute: true
      runner: |
        default=ubuntu-24.04
        linux/arm64=ubuntu-24.04-arm
      cache: true
      cache-scope: ${{ matrix.context }}
      cache-mode: min
      sign: 'false'
      meta-images: ${{ matrix.repository }}
      meta-tags: ${{ matrix.meta-tags }}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ github.event_name != 'pull_request' && secrets.DOCKER_USER || '' }}
          password: ${{ github.event_name != 'pull_request' && secrets.DOCKER_PASS || '' }}

  image-checks:
    needs: [changes, build, native-prepare, native-build, timestral-tests]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Require successful image validation
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          NATIVE_PREPARE_RESULT: ${{ needs.native-prepare.result }}
          NATIVE_BUILD_RESULT: ${{ needs.native-build.result }}
          HAS_NATIVE_IMAGES: ${{ needs.native-prepare.outputs.has-images }}
          TIMESTRAL_TESTS_RESULT: ${{ needs.timestral-tests.result }}
        run: |
          test "$CHANGES_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$NATIVE_PREPARE_RESULT" = success
          test "$TIMESTRAL_TESTS_RESULT" = success
          if [[ "$HAS_NATIVE_IMAGES" == true ]]; then
            test "$NATIVE_BUILD_RESULT" = success
          else
            test "$HAS_NATIVE_IMAGES" = false
            test "$NATIVE_BUILD_RESULT" = skipped
          fi

  native-description:
    needs: [native-prepare, native-build]
    if: ${{ !failure() && !cancelled() && needs.native-build.result == 'success' && github.event_name != 'pull_request' && github.event.inputs.skip_push != 'true' }}
    strategy:
      matrix: ${{ fromJSON(needs.native-prepare.outputs.matrix) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Update Docker Hub repository overview
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
          repository: ${{ matrix.repository }}
          short-description: ${{ matrix.description }}
          readme-filepath: ./${{ matrix.context }}/README.md
          enable-url-completion: true

  publish-mcp-catalog:
    needs: [changes, build, native-build]
    if: >-
      ${{
        always() &&
        needs.build.result == 'success' &&
        needs.native-build.result == 'success' &&
        github.event_name != 'pull_request' &&
        github.event.inputs.skip_push != 'true' &&
        (
          (github.event_name == 'workflow_dispatch' && (inputs.image == 'all' || inputs.image == 'comfy-mcp')) ||
          (github.event_name != 'workflow_dispatch' && needs.changes.outputs.comfy-mcp == 'true')
        )
      }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Install Docker MCP CLI
        env:
          DOCKER_MCP_VERSION: v0.43.3
        run: |
          curl --fail --location --show-error --silent \
            --output /tmp/docker-mcp.tar.gz \
            "https://github.com/docker/mcp-gateway/releases/download/${DOCKER_MCP_VERSION}/docker-mcp-linux-amd64.tar.gz"
          tar --extract --gzip --file /tmp/docker-mcp.tar.gz --directory /tmp
          install --directory "$HOME/.docker/cli-plugins"
          install --mode 0755 /tmp/docker-mcp "$HOME/.docker/cli-plugins/docker-mcp"
          docker mcp version

      - name: Publish MCP catalog
        env:
          DOCKER_MCP_IN_CONTAINER: "1"
        run: |
          install --directory "$HOME/.docker/mcp/catalogs"
          tags=$(python3 scripts/image_tags.py --repository m11s/comfy-mcp \
            --version-arg COMFY_MCP_REF --strip-prefix v --dockerfile comfy-mcp/Dockerfile \
            --latest latest --sha "$GITHUB_SHA")
          image=${tags%%$'\n'*}
          sed "s|^image: .*|image: $image|" comfy-mcp/server.yaml > "$HOME/.docker/mcp/catalogs/comfy-mcp.yaml"
          docker mcp catalog create m11s/mcp-catalog:0.1.0 \
            --title "m11s MCP Catalog" \
            --server file://comfy-mcp.yaml
          docker mcp catalog push m11s/mcp-catalog:0.1.0
          docker mcp catalog tag m11s/mcp-catalog:0.1.0 m11s/mcp-catalog:latest
          docker mcp catalog push m11s/mcp-catalog:latest
