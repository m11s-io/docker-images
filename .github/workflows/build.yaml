name: Build and push

on:
  push:
    branches: [main]
    paths:
      - "rclone-inotify/**"
      - "decap-cms/**"
      - "s3-upload-proxy/**"
      - "redis-http-proxy/**"
      - "comfyui/**"
      - "comfy-mcp/**"
      - "deepseek-harness/**"
      - "chromium-cdp/**"
      - ".github/workflows/build.yaml"
      - "caddy-cloudflare/**"
      - "vllm-openai-orjson/**"
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to build'
        required: false
        type: choice
        default: all
        options:
          - all
          - decap-cms
          - rclone-inotify
          - s3-upload-proxy
          - redis-http-proxy
          - comfyui
          - comfy-mcp
          - deepseek-harness
          - chromium-cdp
          - caddy-cloudflare
          - vllm-openai-orjson
      skip_push:
        description: 'Dry-run: build without pushing to Docker Hub'
        required: false
        type: boolean
        default: false

jobs:
  changes:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rclone-inotify: ${{ steps.filter.outputs.rclone-inotify }}
      decap-cms: ${{ steps.filter.outputs.decap-cms }}
      s3-upload-proxy: ${{ steps.filter.outputs.s3-upload-proxy }}
      redis-http-proxy: ${{ steps.filter.outputs.redis-http-proxy }}
      comfyui: ${{ steps.filter.outputs.comfyui }}
      comfy-mcp: ${{ steps.filter.outputs.comfy-mcp }}
      deepseek-harness: ${{ steps.filter.outputs.deepseek-harness }}
      chromium-cdp: ${{ steps.filter.outputs.chromium-cdp }}
      caddy-cloudflare: ${{ steps.filter.outputs.caddy-cloudflare }}
      vllm-openai-orjson: ${{ steps.filter.outputs.vllm-openai-orjson }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            rclone-inotify:
              - 'rclone-inotify/**'
            decap-cms:
              - 'decap-cms/**'
            s3-upload-proxy:
              - 's3-upload-proxy/**'
            redis-http-proxy:
              - 'redis-http-proxy/**'
            comfyui:
              - 'comfyui/**'
            comfy-mcp:
              - 'comfy-mcp/**'
              - '.github/workflows/build.yaml'
            deepseek-harness:
              - 'deepseek-harness/**'
              - '.github/workflows/build.yaml'
            chromium-cdp:
              - 'chromium-cdp/**'
              - '.github/workflows/build.yaml'
            caddy-cloudflare:
              - 'caddy-cloudflare/**'
            vllm-openai-orjson:
              - 'vllm-openai-orjson/**'

  build:
    needs: [changes]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - context: rclone-inotify
            repository: m11s/rclone
            description: rclone with inotify-tools for filesystem event monitoring.
            tags: m11s/rclone:1.74-inotify
            latest: m11s/rclone:latest-inotify
          - context: decap-cms
            repository: m11s/decap-cms
            description: Decap CMS with an S3-compatible media library.
            tags: m11s/decap-cms:0.2.11-s3
            latest: m11s/decap-cms:latest-s3
          - context: s3-upload-proxy
            repository: m11s/s3-upload-proxy
            description: Multipart upload proxy for S3-compatible object storage.
            tags: m11s/s3-upload-proxy:0.1.3
            latest: m11s/s3-upload-proxy:latest
          - context: redis-http-proxy
            repository: m11s/redis-http-proxy
            description: Bearer-token-authenticated HTTP proxy for Redis.
            tags: m11s/redis-http-proxy:0.1.0
            latest: m11s/redis-http-proxy:latest
          - context: comfyui
            repository: m11s/comfyui
            description: CUDA-enabled ComfyUI image, with an optional GGUF variant.
            tags: m11s/comfyui:0.5.4
            latest: m11s/comfyui:latest
          - context: comfy-mcp
            repository: m11s/comfy-mcp
            description: Comfy MCP server with stdio and native Streamable HTTP transports.
            tags: m11s/comfy-mcp:0.2.2
            latest: m11s/comfy-mcp:latest
            platforms: linux/amd64,linux/arm64
          - context: deepseek-harness
            repository: m11s/deepseek-harness
            description: DeepSeek Harness web runtime with an optional remote browser provider.
            tags: m11s/deepseek-harness:0.1.6-alpha.1
            latest: m11s/deepseek-harness:latest
            platforms: linux/amd64,linux/arm64
          - context: chromium-cdp
            repository: m11s/chromium-cdp
            description: Headless Chromium browser with a Chrome DevTools Protocol listener.
            tags: m11s/chromium-cdp:bookworm-20260824
            latest: m11s/chromium-cdp:latest
            platforms: linux/amd64,linux/arm64
          - context: caddy-cloudflare
            repository: m11s/caddy
            description: Caddy with the Cloudflare DNS-01 provider module.
            tags: m11s/caddy:2.11.4-cloudflare
            latest: m11s/caddy:latest-cloudflare
          # renovate: depName=vllm/vllm-openai
          - context: vllm-openai-orjson
            repository: m11s/vllm-openai-orjson
            description: vLLM OpenAI server image with faster orjson serialization.
            tags: m11s/vllm-openai-orjson:v0.29.0-x86_64
            latest: m11s/vllm-openai-orjson:latest-x86_64
    steps:
      - name: Checkout
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.image == 'all' || inputs.image == matrix.context)) || (github.event_name != 'workflow_dispatch' && needs.changes.outputs[matrix.context] == 'true') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Log in to Docker Hub
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.image == 'all' || inputs.image == matrix.context)) || (github.event_name != 'workflow_dispatch' && needs.changes.outputs[matrix.context] == 'true') }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Set up Docker Buildx
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.image == 'all' || inputs.image == matrix.context)) || (github.event_name != 'workflow_dispatch' && needs.changes.outputs[matrix.context] == 'true') }}
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003  # v4.4.0

      - name: Build and push
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.image == 'all' || inputs.image == matrix.context)) || (github.event_name != 'workflow_dispatch' && needs.changes.outputs[matrix.context] == 'true') }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platforms || 'linux/amd64' }}
          push: ${{ github.event.inputs.skip_push != 'true' }}
          tags: |
            ${{ matrix.tags }}
            ${{ matrix.latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ComfyUI-GGUF variant
        if: ${{ matrix.context == 'comfyui' && ((github.event_name == 'workflow_dispatch' && (inputs.image == 'all' || inputs.image == matrix.context)) || (github.event_name != 'workflow_dispatch' && needs.changes.outputs[matrix.context] == 'true')) }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: comfyui
          file: comfyui/Dockerfile.gguf
          push: ${{ github.event.inputs.skip_push != 'true' }}
          tags: |
            m11s/comfyui:0.5.4-gguf
            m11s/comfyui:latest-gguf
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update Docker Hub repository overview
        if: ${{ github.event.inputs.skip_push != 'true' && ((github.event_name == 'workflow_dispatch' && (inputs.image == 'all' || inputs.image == matrix.context)) || (github.event_name != 'workflow_dispatch' && needs.changes.outputs[matrix.context] == 'true')) }}
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
          repository: ${{ matrix.repository }}
          short-description: ${{ matrix.description }}
          readme-filepath: ./${{ matrix.context }}/README.md
          enable-url-completion: true

  publish-mcp-catalog:
    needs: [changes, build]
    if: >-
      ${{
        always() &&
        needs.build.result == 'success' &&
        github.event.inputs.skip_push != 'true' &&
        (
          (github.event_name == 'workflow_dispatch' && (inputs.image == 'all' || inputs.image == 'comfy-mcp')) ||
          (github.event_name != 'workflow_dispatch' && needs.changes.outputs.comfy-mcp == 'true')
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Install Docker MCP CLI
        env:
          DOCKER_MCP_VERSION: v0.43.3
        run: |
          curl --fail --location --show-error --silent \
            --output /tmp/docker-mcp.tar.gz \
            "https://github.com/docker/mcp-gateway/releases/download/${DOCKER_MCP_VERSION}/docker-mcp-linux-amd64.tar.gz"
          tar --extract --gzip --file /tmp/docker-mcp.tar.gz --directory /tmp
          install --directory "$HOME/.docker/cli-plugins"
          install --mode 0755 /tmp/docker-mcp "$HOME/.docker/cli-plugins/docker-mcp"
          docker mcp version

      - name: Publish MCP catalog
        env:
          DOCKER_MCP_IN_CONTAINER: "1"
        run: |
          install --directory "$HOME/.docker/mcp/catalogs"
          install --mode 0644 comfy-mcp/server.yaml "$HOME/.docker/mcp/catalogs/comfy-mcp.yaml"
          docker mcp catalog create m11s/mcp-catalog:0.1.0 \
            --title "m11s MCP Catalog" \
            --server file://comfy-mcp.yaml
          docker mcp catalog push m11s/mcp-catalog:0.1.0
          docker mcp catalog tag m11s/mcp-catalog:0.1.0 m11s/mcp-catalog:latest
          docker mcp catalog push m11s/mcp-catalog:latest
