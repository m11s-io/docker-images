name: Build and push

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      image:
        description: Image ID to build, or all
        required: false
        type: string
        default: all
      skip_push:
        description: Build without publishing
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      standard: ${{ steps.select.outputs.matrix-standard }}
      native: ${{ steps.select.outputs.matrix-native }}
      has-standard: ${{ steps.select.outputs.has-standard }}
      has-native: ${{ steps.select.outputs.has-native }}
      selected-ids: ${{ steps.select.outputs.selected-ids }}
      timestral-required: ${{ steps.select.outputs.timestral-required }}
      comfy-mcp-selected: ${{ steps.select.outputs.comfy-mcp-selected }}
      timestral-openvino-selected: ${{ steps.select.outputs.timestral-openvino-selected }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Validate selector and image contracts
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Select changed images
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          SELECTED_IMAGE: ${{ inputs.image || 'all' }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          args=(--event "$EVENT_NAME" --selected "$SELECTED_IMAGE" --sha "$GITHUB_SHA")
          if [[ "$EVENT_NAME" == push ]]; then
            args+=(--base "$PUSH_BEFORE" --head "$GITHUB_SHA")
          elif [[ "$EVENT_NAME" == pull_request ]]; then
            args+=(--base "$PR_BASE" --head "$PR_HEAD")
          fi
          python3 scripts/image_matrix.py "${args[@]}" >> "$GITHUB_OUTPUT"

  timestral-tests:
    needs: [changes]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.timestral-required == 'true' }}
    uses: ./.github/workflows/timestral-standard.yaml

  build-standard:
    needs: [changes, timestral-tests]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.has-standard == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.standard) }}
    uses: m11s-io/.github/.github/workflows/container-image.yml@main
    permissions:
      contents: read
    with:
      source-ref: ${{ github.sha }}
      context: ${{ matrix.build_context }}
      dockerfile: ${{ matrix.dockerfile }}
      repository: ${{ matrix.repository }}
      tags: ${{ join(matrix.tags, ',') }}
      platforms: ${{ matrix.platforms }}
      cache-scope: ${{ matrix.id }}
      cache-mode: ${{ matrix.cache_mode }}
      free-space: ${{ matrix.free_space }}
      description: ${{ matrix.description }}
      readme-file: ${{ matrix.readme_file }}
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.skip_push) }}
    secrets:
      DOCKER_USER: ${{ secrets.DOCKER_USER }}
      DOCKER_PASS: ${{ secrets.DOCKER_PASS }}

  native-build:
    needs: [changes]
    if: ${{ !failure() && !cancelled() && needs.changes.outputs.has-native == 'true' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.native) }}
    uses: docker/github-builder/.github/workflows/build.yml@cbc9d42f8c89a55623392aadd03600965b80e963 # v1
    permissions:
      contents: read
      id-token: write
    with:
      job-name-prefix: ${{ matrix.id }}
      context: ${{ matrix.build_context }}
      output: image
      push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.skip_push) }}
      platforms: ${{ matrix.platforms }}
      distribute: true
      runner: |
        default=ubuntu-24.04
        linux/arm64=ubuntu-24.04-arm
      cache: true
      cache-scope: ${{ matrix.id }}
      cache-mode: ${{ matrix.cache_mode }}
      sign: 'false'
      meta-images: ${{ matrix.repository }}
      meta-tags: ${{ matrix['meta-tags'] }}
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.skip_push)) && secrets.DOCKER_USER || '' }}
          password: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.skip_push)) && secrets.DOCKER_PASS || '' }}

  image-checks:
    needs: [changes, build-standard, native-build, timestral-tests]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-26.04
    permissions: {}
    steps:
      - name: Require successful image validation
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          STANDARD_RESULT: ${{ needs.build-standard.result }}
          HAS_STANDARD: ${{ needs.changes.outputs.has-standard }}
          NATIVE_RESULT: ${{ needs.native-build.result }}
          HAS_NATIVE: ${{ needs.changes.outputs.has-native }}
          TIMESTRAL_RESULT: ${{ needs.timestral-tests.result }}
          TIMESTRAL_REQUIRED: ${{ needs.changes.outputs.timestral-required }}
        run: |
          test "$CHANGES_RESULT" = success
          if [[ "$HAS_STANDARD" == true ]]; then test "$STANDARD_RESULT" = success; else test "$HAS_STANDARD" = false && test "$STANDARD_RESULT" = skipped; fi
          if [[ "$HAS_NATIVE" == true ]]; then test "$NATIVE_RESULT" = success; else test "$HAS_NATIVE" = false && test "$NATIVE_RESULT" = skipped; fi
          if [[ "$TIMESTRAL_REQUIRED" == true ]]; then test "$TIMESTRAL_RESULT" = success; else test "$TIMESTRAL_RESULT" = skipped; fi

  native-description:
    needs: [changes, native-build]
    if: ${{ !failure() && !cancelled() && needs.native-build.result == 'success' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.skip_push)) }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.native) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Update Docker Hub repository overview
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
          repository: ${{ matrix.repository }}
          short-description: ${{ matrix.description }}
          readme-filepath: ./${{ matrix.readme_file }}
          enable-url-completion: true

  publish-mcp-catalog:
    needs: [changes, build-standard, native-build]
    if: >-
      ${{ always() && (needs.changes.outputs.has-standard == 'false' || needs.build-standard.result == 'success') && needs.native-build.result == 'success' &&
          needs.changes.outputs.comfy-mcp-selected == 'true' &&
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && !inputs.skip_push)) }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Log in to Docker Hub
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
      - name: Install Docker MCP CLI
        env:
          DOCKER_MCP_VERSION: v0.43.3
        run: |
          curl --fail --location --show-error --silent --output /tmp/docker-mcp.tar.gz \
            "https://github.com/docker/mcp-gateway/releases/download/${DOCKER_MCP_VERSION}/docker-mcp-linux-amd64.tar.gz"
          tar --extract --gzip --file /tmp/docker-mcp.tar.gz --directory /tmp
          install --directory "$HOME/.docker/cli-plugins"
          install --mode 0755 /tmp/docker-mcp "$HOME/.docker/cli-plugins/docker-mcp"
          docker mcp version
      - name: Publish MCP catalog
        env:
          DOCKER_MCP_IN_CONTAINER: "1"
        run: |
          install --directory "$HOME/.docker/mcp/catalogs"
          tags=$(python3 scripts/image_tags.py --repository m11s/comfy-mcp \
            --version-arg COMFY_MCP_REF --strip-prefix v --dockerfile comfy-mcp/Dockerfile \
            --latest latest --sha "$GITHUB_SHA")
          image=${tags%%$'\n'*}
          sed "s|^image: .*|image: $image|" comfy-mcp/server.yaml > "$HOME/.docker/mcp/catalogs/comfy-mcp.yaml"
          docker mcp catalog create m11s/mcp-catalog:0.1.0 --title "m11s MCP Catalog" --server file://comfy-mcp.yaml
          docker mcp catalog push m11s/mcp-catalog:0.1.0
          docker mcp catalog tag m11s/mcp-catalog:0.1.0 m11s/mcp-catalog:latest
          docker mcp catalog push m11s/mcp-catalog:latest

  publish-timestral-profiles:
    needs: [changes, timestral-tests, build-standard]
    if: >-
      ${{ !cancelled() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') &&
          !inputs.skip_push && needs.build-standard.result == 'success' && needs.timestral-tests.result == 'success' &&
          needs.changes.outputs.timestral-openvino-selected == 'true' }}
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/timestral-openvino.yaml
    with:
      reuse-validation: true
