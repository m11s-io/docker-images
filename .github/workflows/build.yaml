name: Build and push

on:
  push:
    branches: [main]
    paths:
      - "rclone-inotify/**"
      - "decap-cms/**"
      - "s3-upload-proxy/**"
      - "redis-http-proxy/**"
      - "comfyui/**"
      - "comfy-mcp/**"
      - "deepseek-harness/**"
      - "chromium-cdp/**"
      - ".github/workflows/build.yaml"
      - "caddy-cloudflare/**"
      - "vllm-openai-orjson/**"
      - "scripts/image_tags.py"
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to build'
        required: false
        type: choice
        default: all
        options:
          - all
          - decap-cms
          - rclone-inotify
          - s3-upload-proxy
          - redis-http-proxy
          - comfyui
          - comfy-mcp
          - deepseek-harness
          - chromium-cdp
          - caddy-cloudflare
          - vllm-openai-orjson
      skip_push:
        description: 'Dry-run: build without pushing to Docker Hub'
        required: false
        type: boolean
        default: false

jobs:
  changes:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      rclone-inotify: ${{ steps.filter.outputs.rclone-inotify }}
      decap-cms: ${{ steps.filter.outputs.decap-cms }}
      s3-upload-proxy: ${{ steps.filter.outputs.s3-upload-proxy }}
      redis-http-proxy: ${{ steps.filter.outputs.redis-http-proxy }}
      comfyui: ${{ steps.filter.outputs.comfyui }}
      comfy-mcp: ${{ steps.filter.outputs.comfy-mcp }}
      deepseek-harness: ${{ steps.filter.outputs.deepseek-harness }}
      chromium-cdp: ${{ steps.filter.outputs.chromium-cdp }}
      caddy-cloudflare: ${{ steps.filter.outputs.caddy-cloudflare }}
      vllm-openai-orjson: ${{ steps.filter.outputs.vllm-openai-orjson }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check image tag resolver
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d  # v4.0.3
        with:
          filters: |
            rclone-inotify:
              - 'scripts/image_tags.py'
              - '.github/workflows/build.yaml'
              - 'rclone-inotify/**'
            decap-cms:
              - 'scripts/image_tags.py'
              - '.github/workflows/build.yaml'
              - 'decap-cms/**'
            s3-upload-proxy:
              - 'scripts/image_tags.py'
              - '.github/workflows/build.yaml'
              - 's3-upload-proxy/**'
            redis-http-proxy:
              - 'scripts/image_tags.py'
              - '.github/workflows/build.yaml'
              - 'redis-http-proxy/**'
            comfyui:
              - 'scripts/image_tags.py'
              - '.github/workflows/build.yaml'
              - 'comfyui/**'
            comfy-mcp:
              - 'scripts/image_tags.py'
              - '.github/workflows/build.yaml'
              - 'comfy-mcp/**'
            deepseek-harness:
              - 'scripts/image_tags.py'
              - '.github/workflows/build.yaml'
              - 'deepseek-harness/**'
            chromium-cdp:
              - 'scripts/image_tags.py'
              - '.github/workflows/build.yaml'
              - 'chromium-cdp/**'
            caddy-cloudflare:
              - 'scripts/image_tags.py'
              - '.github/workflows/build.yaml'
              - 'caddy-cloudflare/**'
            vllm-openai-orjson:
              - 'scripts/image_tags.py'
              - '.github/workflows/build.yaml'
              - 'vllm-openai-orjson/**'

  build:
    needs: [changes]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - context: rclone-inotify
            repository: m11s/rclone
            description: rclone with inotify-tools for filesystem event monitoring.
            version_source: base-image
            version_ref: rclone/rclone
            tag_suffix: -inotify
            latest: latest-inotify
          - context: decap-cms
            repository: m11s/decap-cms
            description: Decap CMS with an S3-compatible media library.
            version: 0.2.11-s3
            latest: latest-s3
          - context: s3-upload-proxy
            repository: m11s/s3-upload-proxy
            description: Multipart upload proxy for S3-compatible object storage.
            version: 0.1.3
            latest: latest
          - context: redis-http-proxy
            repository: m11s/redis-http-proxy
            description: Bearer-token-authenticated HTTP proxy for Redis.
            version: 0.1.0
            latest: latest
          - context: comfyui
            repository: m11s/comfyui
            description: CUDA-enabled ComfyUI image, with an optional GGUF variant.
            version: 0.5.5
            latest: latest
          - context: comfy-mcp
            repository: m11s/comfy-mcp
            description: Comfy MCP server with stdio and native Streamable HTTP transports.
            version: 0.2.3
            latest: latest
            platforms: linux/amd64,linux/arm64
          - context: deepseek-harness
            repository: m11s/deepseek-harness
            description: DeepSeek Harness web runtime with an optional remote browser provider.
            version: 0.2.0-rc.2
            latest: latest
            platforms: linux/amd64,linux/arm64
          - context: chromium-cdp
            repository: m11s/chromium-cdp
            description: Headless Chromium browser with a Chrome DevTools Protocol listener.
            version: bookworm-20261005
            latest: latest
            platforms: linux/amd64,linux/arm64
          - context: caddy-cloudflare
            repository: m11s/caddy
            description: Caddy with the Cloudflare DNS-01 provider module.
            version: 2.11.4-cloudflare
            latest: latest-cloudflare
          - context: vllm-openai-orjson
            repository: m11s/vllm-openai-orjson
            description: vLLM OpenAI server image with faster orjson serialization.
            version_source: base-arg
            version_ref: VLLM_BASE_IMAGE
            latest: latest-x86_64
    steps:
      - name: Checkout
        id: checkout
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.image == 'all' || inputs.image == matrix.context)) || (github.event_name != 'workflow_dispatch' && needs.changes.outputs[matrix.context] == 'true') }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Resolve image tags
        id: image-tags
        if: ${{ steps.checkout.outcome == 'success' }}
        env:
          IMAGE_CONTEXT: ${{ matrix.context }}
          IMAGE_REPOSITORY: ${{ matrix.repository }}
          IMAGE_VERSION: ${{ matrix.version }}
          VERSION_SOURCE: ${{ matrix.version_source }}
          VERSION_REF: ${{ matrix.version_ref }}
          TAG_SUFFIX: ${{ matrix.tag_suffix }}
          LATEST_TAG: ${{ matrix.latest }}
        run: |
          args=(--repository "$IMAGE_REPOSITORY" --latest "$LATEST_TAG" --sha "$GITHUB_SHA"
                --suffix="$TAG_SUFFIX")
          if [[ -n "$VERSION_SOURCE" ]]; then
            args+=("--$VERSION_SOURCE" "$VERSION_REF" --dockerfile "$IMAGE_CONTEXT/Dockerfile")
          else
            args+=(--version "$IMAGE_VERSION")
          fi
          tags=$(python3 scripts/image_tags.py "${args[@]}")
          {
            echo 'tags<<IMAGE_TAGS'
            echo "$tags"
            echo 'IMAGE_TAGS'
          } >> "$GITHUB_OUTPUT"
          if [[ "$IMAGE_CONTEXT" == comfyui ]]; then
            gguf_tags=$(python3 scripts/image_tags.py --repository "$IMAGE_REPOSITORY" \
              --version "$IMAGE_VERSION" --suffix=-gguf --latest latest-gguf --sha "$GITHUB_SHA")
            {
              echo 'gguf-tags<<IMAGE_TAGS'
              echo "$gguf_tags"
              echo 'IMAGE_TAGS'
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to Docker Hub
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.image == 'all' || inputs.image == matrix.context)) || (github.event_name != 'workflow_dispatch' && needs.changes.outputs[matrix.context] == 'true') }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Set up Docker Buildx
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.image == 'all' || inputs.image == matrix.context)) || (github.event_name != 'workflow_dispatch' && needs.changes.outputs[matrix.context] == 'true') }}
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Build and push
        id: generic
        if: ${{ (github.event_name == 'workflow_dispatch' && (inputs.image == 'all' || inputs.image == matrix.context)) || (github.event_name != 'workflow_dispatch' && needs.changes.outputs[matrix.context] == 'true') }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: ${{ matrix.context }}
          platforms: ${{ matrix.platforms || 'linux/amd64' }}
          push: ${{ github.event.inputs.skip_push != 'true' }}
          load: ${{ matrix.context == 'comfyui' && github.event.inputs.skip_push == 'true' }}
          tags: ${{ steps.image-tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push ComfyUI-GGUF variant
        if: ${{ github.event.inputs.skip_push != 'true' && matrix.context == 'comfyui' && ((github.event_name == 'workflow_dispatch' && (inputs.image == 'all' || inputs.image == matrix.context)) || (github.event_name != 'workflow_dispatch' && needs.changes.outputs[matrix.context] == 'true')) }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: comfyui
          file: comfyui/Dockerfile.gguf
          platforms: linux/amd64
          build-args: |
            COMFYUI_BASE=m11s/comfyui@${{ steps.generic.outputs.digest }}
          push: ${{ github.event.inputs.skip_push != 'true' }}
          tags: ${{ steps.image-tags.outputs.gguf-tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build ComfyUI-GGUF variant without pushing
        if: ${{ github.event.inputs.skip_push == 'true' && matrix.context == 'comfyui' && github.event_name == 'workflow_dispatch' && (inputs.image == 'all' || inputs.image == matrix.context) }}
        env:
          COMFYUI_BASE: ${{ matrix.tags }}
        run: |
          docker buildx build --builder default --platform linux/amd64 --load \
            --build-arg "COMFYUI_BASE=$COMFYUI_BASE" \
            -f comfyui/Dockerfile.gguf -t m11s/comfyui:0.5.5-gguf comfyui

      - name: Check ComfyUI image dependencies and CPU startup
        if: ${{ github.event.inputs.skip_push == 'true' && matrix.context == 'comfyui' && github.event_name == 'workflow_dispatch' && (inputs.image == 'all' || inputs.image == matrix.context) }}
        run: |
          set -euo pipefail
          for image in m11s/comfyui:0.5.5 m11s/comfyui:0.5.5-gguf; do
            docker run --rm --entrypoint python3.14 "$image" -m pip check
            docker run --rm --entrypoint python3.14 "$image" -c '
          import torch, torchvision, comfy.audio, av
          assert torch.__version__ == "2.14.1+cu130"
          assert torchvision.__version__ == "0.29.1+cu130"
          assert torch.version.cuda == "13.0"
          assert comfy.audio.resample(torch.zeros(1, 480), 48000, 24000).shape == (1, 240)
          print(torch.__version__, torchvision.__version__, torch.version.cuda)
          '
            container=$(docker run --detach "$image" --cpu)
            trap 'docker logs "$container"; docker rm -f "$container"' EXIT
            ready=false
            for attempt in {1..60}; do
              if docker exec "$container" python3.14 -c 'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8188/system_stats", timeout=5)'; then
                ready=true
                break
              fi
              sleep 2
            done
            if [ "$ready" != true ]; then
              exit 1
            fi
            if [[ "$image" == *-gguf ]]; then
              docker exec "$container" python3.14 -c '
          import json, urllib.request
          nodes = json.load(urllib.request.urlopen("http://127.0.0.1:8188/object_info", timeout=5))
          assert "UnetLoaderGGUF" in nodes
          '
            fi
            docker logs "$container"
            docker rm -f "$container"
            trap - EXIT
          done

      - name: Update Docker Hub repository overview
        if: ${{ github.event.inputs.skip_push != 'true' && ((github.event_name == 'workflow_dispatch' && (inputs.image == 'all' || inputs.image == matrix.context)) || (github.event_name != 'workflow_dispatch' && needs.changes.outputs[matrix.context] == 'true')) }}
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}
          repository: ${{ matrix.repository }}
          short-description: ${{ matrix.description }}
          readme-filepath: ./${{ matrix.context }}/README.md
          enable-url-completion: true

  publish-mcp-catalog:
    needs: [changes, build]
    if: >-
      ${{
        always() &&
        needs.build.result == 'success' &&
        github.event.inputs.skip_push != 'true' &&
        (
          (github.event_name == 'workflow_dispatch' && (inputs.image == 'all' || inputs.image == 'comfy-mcp')) ||
          (github.event_name != 'workflow_dispatch' && needs.changes.outputs.comfy-mcp == 'true')
        )
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      - name: Install Docker MCP CLI
        env:
          DOCKER_MCP_VERSION: v0.43.3
        run: |
          curl --fail --location --show-error --silent \
            --output /tmp/docker-mcp.tar.gz \
            "https://github.com/docker/mcp-gateway/releases/download/${DOCKER_MCP_VERSION}/docker-mcp-linux-amd64.tar.gz"
          tar --extract --gzip --file /tmp/docker-mcp.tar.gz --directory /tmp
          install --directory "$HOME/.docker/cli-plugins"
          install --mode 0755 /tmp/docker-mcp "$HOME/.docker/cli-plugins/docker-mcp"
          docker mcp version

      - name: Publish MCP catalog
        env:
          DOCKER_MCP_IN_CONTAINER: "1"
        run: |
          install --directory "$HOME/.docker/mcp/catalogs"
          install --mode 0644 comfy-mcp/server.yaml "$HOME/.docker/mcp/catalogs/comfy-mcp.yaml"
          docker mcp catalog create m11s/mcp-catalog:0.1.0 \
            --title "m11s MCP Catalog" \
            --server file://comfy-mcp.yaml
          docker mcp catalog push m11s/mcp-catalog:0.1.0
          docker mcp catalog tag m11s/mcp-catalog:0.1.0 m11s/mcp-catalog:latest
          docker mcp catalog push m11s/mcp-catalog:latest
