name: Lint Dockerfiles

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  droast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Lint Dockerfiles
        uses: immanuwell/dockerfile-roast@1c87b2aa189338c24db4acde40864dae8994de8f  # 1.7.0
        with:
          files: .
          image-tag: "1.7.0"
          no-roast: "true"
          no-fail: "false"
