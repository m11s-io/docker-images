name: comfy-mcp
title: ComfyUI
type: server
image: m11s/comfy-mcp:0.1.0
description: Drive an approved ComfyUI instance through the Comfy MCP stdio server.
allowHosts:
  - host.docker.internal:8188
  - comfyui.comfyui.svc.cluster.local:8188
config:
  env:
    - name: COMFY_LOCAL_URL
      example: http://host.docker.internal:8188
      value: "{{comfy-mcp.comfy_local_url}}"
    - name: COMFYUI_URL
      example: http://comfyui.comfyui.svc.cluster.local:8188
      value: "{{comfy-mcp.comfyui_url}}"
  parameters:
    type: object
    properties:
      comfy_local_url:
        type: string
        description: Local or port-forwarded ComfyUI URL. Prefer this for Docker Desktop.
      comfyui_url:
        type: string
        description: Private remote ComfyUI URL for an in-cluster agent.
