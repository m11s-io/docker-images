name: comfy-mcp
title: ComfyUI
type: server
image: m11s/comfy-mcp:0.2.2
description: Drive an approved ComfyUI instance through the Comfy MCP server.
allowHosts:
  - host.docker.internal:8188
env:
  - name: COMFY_LOCAL_URL
    value: "{{comfy-mcp.comfy_local_url}}"
config:
  - name: comfy-mcp
    description: Configure the local or port-forwarded ComfyUI endpoint.
    type: object
    properties:
      comfy_local_url:
        type: string
        description: Local or port-forwarded ComfyUI URL. Prefer this for Docker Desktop.
        default: http://host.docker.internal:8188
    required:
      - comfy_local_url
