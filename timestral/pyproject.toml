[project]
name = "m11s-timestral-api"
version = "0.1.0"
description = "Internal HTTP API for upstream Timestral forecasting"
requires-python = ">=3.15,<3.16"
dependencies = [
  "fastapi==0.162.0",
  "numpy==2.5.4",
  "pydantic-settings==2.16.1",
  "timestral @ git+https://github.com/mistralai/timestral.git@a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff",
  "torch==2.14.1+cpu",
  "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==9.1.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["cpu: downloads and runs a real CPU checkpoint", "cuda: requires a CUDA device"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
