[project]
name = "m11s-timestral-api"
version = "0.1.0"
description = "Internal HTTP API for upstream Timestral forecasting"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.120.0",
  "numpy==2.2.6",
  "pydantic-settings==2.11.0",
  "timestral @ git+https://github.com/mistralai/timestral.git@a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff",
  "torch==2.13.0",
  "uvicorn[standard]==0.38.0",
]

[dependency-groups]
dev = ["httpx==0.28.1", "pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["cpu: downloads and runs a real CPU checkpoint", "cuda: requires a CUDA device"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
