[project]
name = "timestral-openvino-export"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.6.0+cpu",
  "openvino==2026.4.1",
  "numpy==2.2.6",
  "safetensors==0.6.2",
  "huggingface-hub==2.3.0",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[dependency-groups]
dev = ["pytest==9.1.1"]
