[project]
name = "timestral-standard-rocm"
version = "0.1.0"
requires-python = ">=3.15,<3.16"
dependencies = [
  "kserve @ git+https://github.com/kserve/kserve.git@abc6c47ab4af588e40c67372b4835122234f6f74#subdirectory=python/kserve",
  "timestral @ git+https://github.com/mistralai/timestral.git@a534bdbd244d64f3d9d743f46c7bf6fc330ed4ff",
  "torch==2.14.1+rocm7.2",
  "triton-rocm==3.8.0",
  "numpy==2.5.4",
]

[dependency-groups]
dev = ["pydantic-settings==2.16.1", "pytest==9.1.1", "pytest-asyncio==1.4.1", "tritonclient[http,grpc]==2.73.0"]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
triton-rocm = { index = "pytorch-rocm" }
