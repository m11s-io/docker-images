services:
  dsh:
    image: m11s/deepseek-harness:0.2.0-rc.2@sha256:3b2a7d6f4e7954f121dd9cdab3b2634aaed45f2b64e60fe12e428dcf034c89f3
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in the environment}
      DSH_BIND_HOST: ${DSH_BIND_HOST:-}
      DSH_BROWSER_CDP_ENDPOINT: ${DSH_BROWSER_CDP_ENDPOINT:-http://chromium:9222}
    ports:
      - "3080:3080"
    volumes:
      - dsh-home:/home/dsh/.dsh
      - ./workspace:/workspace
    depends_on:
      chromium:
        condition: service_started
    user: "10001:10001"

  chromium:
    build: ../chromium
    image: m11s/chromium:local-cdp
    shm_size: 1gb
    user: "10001:10001"

volumes:
  dsh-home:
