services:
  dsh:
    image: m11s/deepseek-harness:0.2.0-rc.2@sha256:0ea40cc9f22cfc0afbf7c035ce468b5cf955092c2a4aa742b3d904a96cd0b9b0
    environment:
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:?set DEEPSEEK_API_KEY in the environment}
      DSH_BROWSER_CDP_ENDPOINT: ${DSH_BROWSER_CDP_ENDPOINT:-http://chromium:9222}
    ports:
      - "3080:3080"
    volumes:
      - dsh-home:/home/dsh/.dsh
      - ./workspace:/workspace
    depends_on:
      chromium:
        condition: service_started
    user: "10001:10001"

  chromium:
    build: ../chromium-cdp
    image: m11s/chromium-cdp:local
    shm_size: 1gb
    security_opt:
      - seccomp=unconfined
    user: "10001:10001"

volumes:
  dsh-home:
