worker_processes 1;
pid /tmp/nginx.pid;
error_log stderr warn;
events { worker_connections 128; }
http {
    access_log off;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }
    server {
        listen 9222;
        location / {
            proxy_pass http://127.0.0.1:9223;
            proxy_http_version 1.1;
            # Chromium rejects Docker service names in the Host header.
            proxy_set_header Host localhost:9223;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 1h;
            # Discovery must advertise the proxy, not Chromium's loopback port.
            sub_filter_types application/json;
            sub_filter_once off;
            sub_filter 'ws://localhost:9223/' 'ws://$http_host/';
            sub_filter 'ws://127.0.0.1:9223/' 'ws://$http_host/';
        }
    }
}
